# Raw Orders Dataset - Source System
version: 1
kind: dataset
id: raw_orders

namespace: "postgres://source-db:5432"
name: "public.orders"

schema:
  fields:
    - name: order_id
      type: integer
      description: "Primary key"
    - name: user_id
      type: integer
      description: "Foreign key to users table"
    - name: product_id
      type: integer
    - name: quantity
      type: integer
    - name: unit_price
      type: decimal(10,2)
    - name: order_date
      type: timestamp
    - name: status
      type: varchar(20)

ownership:
  owners:
    - name: commerce-team
      type: TEAM

description: "Raw order transactions from e-commerce platform"
tags:
  - source
  - orders
  - transactions
