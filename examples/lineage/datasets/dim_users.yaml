# Dim Users - Analytics Data Warehouse
version: 1
kind: dataset
id: dim_users

namespace: "postgres://warehouse:5432"
name: "analytics.dim_users"

schema:
  fields:
    - name: user_id
      type: integer
      description: "Surrogate key"
    - name: email_hash
      type: varchar(64)
      description: "SHA256 hash of email (anonymized)"
    - name: full_name
      type: varchar(200)
      description: "Concatenated first and last name"
    - name: account_age_days
      type: integer
      description: "Days since account creation"
    - name: is_active
      type: boolean
      description: "Whether account is currently active"
    - name: processed_at
      type: timestamp
      description: "ETL processing timestamp"

ownership:
  owners:
    - name: analytics-team
      type: TEAM
    - name: john.smith
      type: PERSON

description: "User dimension table for analytics queries"
tags:
  - warehouse
  - dimension
  - users
