# Fact Orders - Analytics Data Warehouse
version: 1
kind: dataset
id: fact_orders

namespace: "postgres://warehouse:5432"
name: "analytics.fact_orders"

schema:
  fields:
    - name: order_key
      type: integer
    - name: user_id
      type: integer
    - name: product_id
      type: integer
    - name: quantity
      type: integer
    - name: total_amount
      type: decimal(10,2)
      description: "quantity * unit_price"
    - name: order_date
      type: date
    - name: processed_at
      type: timestamp

ownership:
  owners:
    - name: analytics-team
      type: TEAM

description: "Order facts for analytics"
tags:
  - warehouse
  - fact
  - orders
