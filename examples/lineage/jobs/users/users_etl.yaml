version: 1
kind: job
id: users_etl
namespace: airflow

name: "users-etl-job"
jobPath: "/etl/users/daily_process.py"
enabled: true

applicationId: "data_platform.user_data_service"

execution:
  type: "BATCH"
  schedule: "0 2 * * *" # Daily at 2 AM

inputs:
  - ref: raw_users

outputs:
  - ref: dim_users
    columnLineage:
      user_id:
        - inputField: id
          inputDataset: raw_users
          transformation: IDENTITY
          description: "Direct mapping of user ID"
      email_hash:
        - inputField: email
          inputDataset: raw_users
          transformation: HASH_SHA256
          description: "SHA256 hash for GDPR compliance"
          masking: true
      full_name:
        - inputField: first_name
          inputDataset: raw_users
          transformation: CONCAT
          description: "Concatenated with last_name"
        - inputField: last_name
          inputDataset: raw_users
          transformation: CONCAT
          description: "Concatenated with first_name"
      account_age_days:
        - inputField: created_at
          inputDataset: raw_users
          transformation: DATEDIFF
          description: "CURRENT_DATE - created_at"
      is_active:
        - inputField: status
          inputDataset: raw_users
          transformation: FILTER
          description: "status = 'active'"

extractorMetadata:
  type: "MANUAL"
  confidence: 1.0
  toolName: "Lineage Designer"
  toolVersion: "1.0.0"

reviewMetadata:
  lastReviewDate: "2023-10-01"
  lastReviewedByBrid: "BRID-554433"
  reviewStatus: "APPROVED"

ownership:
  owners:
    - name: "Data Engineering"
      type: "TEAM"
      email: "data-eng@example.com"
      brid: "BRID-112233"

tags:
  - etl
  - daily
  - core-processing
