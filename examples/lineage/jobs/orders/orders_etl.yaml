version: 1
kind: job
id: orders_etl
namespace: airflow

name: "orders-etl-job"
description: "Transforms raw order data into analytics fact table with calculated total amounts"
jobPath: "/etl/orders/daily_fact_load.py"
enabled: true

applicationId: "ecommerce.order_processing_service"

execution:
  type: "BATCH"
  schedule: "0 4 * * *" # Daily at 4 AM

inputs:
  - ref: raw_orders

outputs:
  - ref: fact_orders
    columnLineage:
      order_key:
        - inputField: order_id
          inputDataset: raw_orders
          transformation: IDENTITY
      user_id:
        - inputField: user_id
          inputDataset: raw_orders
          transformation: IDENTITY
      product_id:
        - inputField: product_id
          inputDataset: raw_orders
          transformation: IDENTITY
      quantity:
        - inputField: quantity
          inputDataset: raw_orders
          transformation: IDENTITY
      total_amount:
        - inputField: quantity
          inputDataset: raw_orders
          transformation: AGGREGATE
          description: "quantity * unit_price"
        - inputField: unit_price
          inputDataset: raw_orders
          transformation: AGGREGATE
      order_date:
        - inputField: order_date
          inputDataset: raw_orders
          transformation: CAST
          description: "Cast to date (truncate time)"

extractorMetadata:
  type: "MANUAL"
  confidence: 0.95
  toolName: "Lineage Designer"
  toolVersion: "1.0.0"

reviewMetadata:
  lastReviewDate: "2023-10-15"
  lastReviewedByBrid: "BRID-223344"
  reviewStatus: "APPROVED"

ownership:
  owners:
    - name: "Data Engineering"
      type: "TEAM"
      email: "data-eng@example.com"
      brid: "BRID-112233"

tags:
  - etl
  - daily
  - commerce
  - fact-load
